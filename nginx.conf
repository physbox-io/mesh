# The page Volt opens to link a scene goes without the isolation headers.
# Isolated, it lands in a browsing context group of its own: its
# window.opener is null and Volt's handle to it reads as closed, so the link
# never answers. It runs MuJoCo single-threaded instead. add_header sends
# nothing for an empty value.
map $arg_link $coop {
    volt    "";
    default same-origin;
}
map $arg_link $coep {
    volt    "";
    default require-corp;
}

server {
    listen ${PORT};
    server_name localhost;

    # physics.expt.in is a legacy domain still indexed by Google; redirect it
    # permanently to mesh.physbox.io instead of just dropping the mapping,
    # so search rankings carry over.
    if ($host = physics.expt.in) {
        return 301 https://mesh.physbox.io$request_uri;
    }

    # The sign-in page, deliberately without the isolation headers.
    #
    # `Cross-Origin-Opener-Policy: same-origin` below is what earns the app
    # SharedArrayBuffer, and is also what leaves Google's sign-in popup blank —
    # it severs `window.opener`, so Google's script has nothing to postMessage
    # back to. This one document is served without it; the session it produces
    # reaches the app through localStorage, which needs no window handle.
    location = /signin.html {
        root /usr/share/nginx/html;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        # $coop/$coep are empty, so not sent, for the page Volt opens to link
        # a scene (?link=volt): see the map at the top.
        add_header Cross-Origin-Opener-Policy $coop;
        add_header Cross-Origin-Embedder-Policy $coep;
        # The page names this build's hashed files; a cached copy would name
        # files the next deploy deletes.
        add_header Cache-Control no-cache;
    }

    # Hashed build output: never changes under its name, and a name that is not
    # here is a 404, not index.html. A tab that outlived a deploy asks for the
    # old names; answered with the page, its module workers refused the HTML and
    # died as "The export worker stopped." The isolation headers are repeated
    # because an add_header here replaces the ones above, and the workers need
    # them for SharedArrayBuffer.
    location /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Which build is live; utils/staleBuild.ts compares it with the tab's own.
    location = /version.json {
        root /usr/share/nginx/html;
        add_header Cache-Control no-store;
    }

    # Enable compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
