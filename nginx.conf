server {
    listen ${PORT};
    server_name localhost;

    # The sign-in page, deliberately without the isolation headers.
    #
    # `Cross-Origin-Opener-Policy: same-origin` below is what earns the app
    # SharedArrayBuffer, and is also what leaves Google's sign-in popup blank —
    # it severs `window.opener`, so Google's script has nothing to postMessage
    # back to. This one document is served without it; the session it produces
    # reaches the app through localStorage, which needs no window handle.
    location = /signin.html {
        root /usr/share/nginx/html;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        add_header Cross-Origin-Opener-Policy same-origin;
        add_header Cross-Origin-Embedder-Policy require-corp;
    }

    # Enable compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
