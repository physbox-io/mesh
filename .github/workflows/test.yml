# Tests, and the gate in front of the deploy.
#
# Cloud Build used to build straight off a push to main, so nothing ever ran
# the suite before a deploy: the image was typechecked and bundled and that was
# all. The trigger now watches the `deploy` branch instead, and the only thing
# that writes to `deploy` is the job below, after the tests have passed. A red
# main therefore stays on main.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

# A second push while the first is still running makes the first irrelevant:
# only the newest commit on a branch is a deploy candidate.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # 22, matching the builder stage in the Dockerfile.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `ci`, not `install`: the lockfile is what the tests are meant to run
      # against, and @physbox-io packages sit on a caret range.
      #
      # @physbox-io/ui and @physbox-io/machining are private packages owned by
      # the ui and machining repos. The built-in GITHUB_TOKEN is scoped to this
      # repo, so it cannot read them, and npm ci fails on 401. Either works:
      #   - grant the mesh repo read access to each package (Package settings ->
      #     Manage Actions access), and the built-in token below is enough; or
      #   - set a PACKAGES_TOKEN secret to a PAT with read:packages.
      # Preferring the first: no secret to rotate.
      - name: Install
        run: npm ci
        env:
          GITHUB_TOKEN: ${{ secrets.PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

      # `tsc -b`, not `tsc`: the root tsconfig is `{"files": [], "references":
      # [...]}`, so without `-b` the compiler is handed no inputs and exits 0
      # on any code at all. See CLAUDE.md.
      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

  # Hands the tested commit to Cloud Build. The trigger watches `deploy`.
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Forced because `deploy` is not a branch anyone works on - it is a
      # pointer at the last commit that passed, and it only ever moves to a
      # commit that is already on main.
      - name: Release to Cloud Build
        run: git push --force origin ${{ github.sha }}:refs/heads/deploy
