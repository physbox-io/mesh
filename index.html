        <h1>PhysBox: Mesh</h1>
        <p>Mesh is a free 3D design and physics simulation app that runs in your browser.
          Model parts with solid (CSG) modelling, sculpting and lattice box-modelling, simulate them with
          the MuJoCo physics engine, and prepare them for fabrication: 3D-print analysis and 3MF/STL export,
          CNC relief carving and machining toolpaths, laser cutting, and mold making for casting.</p>
        <p>Part of the <a href="https://physbox.io/">PhysBox</a> suite of engineering tools, with
          <a href="https://volt.physbox.io/">Volt</a> (electronics) and <a href="https://etch.physbox.io/">Etch</a> (laser cutting).</p>
        <p><a href="https://physbox.io/privacy.html">Privacy</a> ·
