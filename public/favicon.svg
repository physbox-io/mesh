<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Cyan to Blue Gradient -->
    <linearGradient id="grad-cyan-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <!-- Blue to Purple Gradient -->
    <linearGradient id="grad-blue-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    
    <!-- Semi-transparent Face Gradients for Glassmorphic Depth -->
    <linearGradient id="face-top-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.15" />
    </linearGradient>
    <linearGradient id="face-left-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="face-right-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.20" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0.20" />
    </linearGradient>

    <!-- Glowing Drop Shadow for 3D depth and pop -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#3b82f6" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 3D Isometric Faces (Fills) -->
  <polygon points="256,60 426,158 256,256 86,158" fill="url(#face-top-grad)" />
  <polygon points="86,158 256,256 256,452 86,354" fill="url(#face-left-grad)" />
  <polygon points="256,256 426,158 426,354 256,452" fill="url(#face-right-grad)" />

  <!-- Thin Mesh Subdivision / Wireframe Lines (Internal Detail) -->
  <g stroke="url(#grad-cyan-blue)" stroke-width="4.5" stroke-opacity="0.75" stroke-linecap="round" stroke-linejoin="round">
    <!-- Top Face Diagonals and Midpoint Grid -->
    <line x1="256" y1="60" x2="256" y2="256" />
    <line x1="86" y1="158" x2="426" y2="158" />
    <line x1="171" y1="109" x2="341" y2="207" />
    <line x1="341" y1="109" x2="171" y2="207" />

    <!-- Left Face Diagonals and Midpoint Grid -->
    <line x1="86" y1="158" x2="256" y2="452" />
    <line x1="256" y1="256" x2="86" y2="354" />
    <line x1="86" y1="256" x2="256" y2="354" />
    <line x1="171" y1="207" x2="171" y2="403" />

    <!-- Right Face Diagonals and Midpoint Grid -->
    <line x1="256" y1="256" x2="426" y2="354" />
    <line x1="426" y1="158" x2="256" y2="452" />
    <line x1="341" y1="207" x2="341" y2="403" />
    <line x1="256" y1="354" x2="426" y2="256" />
  </g>

  <!-- Thick Outer Boundary and Inner Main Edges (The 3D Structure) -->
  <g stroke="url(#grad-blue-purple)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Outer boundary of the cube -->
    <polygon points="256,60 426,158 426,354 256,452 86,354 86,158" fill="none" />
    <!-- Inner main edges from center vertex -->
    <line x1="256" y1="256" x2="256" y2="452" />
    <line x1="256" y1="256" x2="86" y2="158" />
    <line x1="256" y1="256" x2="426" y2="158" />
  </g>

  <!-- Glowing Mesh Nodes (Vertices and Intersections) -->
  <g fill="#ffffff">
    <!-- Primary Corner Nodes -->
    <circle cx="256" cy="60" r="10" stroke="#7c3aed" stroke-width="4" />
    <circle cx="86" cy="158" r="10" stroke="#3b82f6" stroke-width="4" />
    <circle cx="426" cy="158" r="10" stroke="#3b82f6" stroke-width="4" />
    <circle cx="256" cy="256" r="11" stroke="#3b82f6" stroke-width="4.5" />
    <circle cx="86" cy="354" r="10" stroke="#3b82f6" stroke-width="4" />
    <circle cx="426" cy="354" r="10" stroke="#3b82f6" stroke-width="4" />
    <circle cx="256" cy="452" r="10" stroke="#7c3aed" stroke-width="4" />

    <!-- Edge Midpoint Nodes -->
    <circle cx="171" cy="109" r="6.5" stroke="#00f2fe" stroke-width="3" />
    <circle cx="341" cy="109" r="6.5" stroke="#00f2fe" stroke-width="3" />
    <circle cx="171" cy="207" r="6.5" stroke="#00f2fe" stroke-width="3" />
    <circle cx="341" cy="207" r="6.5" stroke="#00f2fe" stroke-width="3" />
    <circle cx="86" cy="256" r="6.5" stroke="#00f2fe" stroke-width="3" />
    <circle cx="256" cy="354" r="6.5" stroke="#00f2fe" stroke-width="3" />
    <circle cx="171" cy="403" r="6.5" stroke="#00f2fe" stroke-width="3" />
    <circle cx="341" cy="403" r="6.5" stroke="#00f2fe" stroke-width="3" />
    <circle cx="426" cy="256" r="6.5" stroke="#00f2fe" stroke-width="3" />

    <!-- Face Centroid Nodes -->
    <circle cx="256" cy="158" r="6.5" stroke="#7c3aed" stroke-width="3" />
    <circle cx="171" cy="305" r="6.5" stroke="#7c3aed" stroke-width="3" />
    <circle cx="341" cy="305" r="6.5" stroke="#7c3aed" stroke-width="3" />
  </g>
</svg>