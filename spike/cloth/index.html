<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cloth Spike</title>
  <style>
    html, body { margin: 0; height: 100%; background: #14161a; color: #d8dce3; font: 13px/1.4 system-ui, sans-serif; }
    canvas { display: block; }
    #hud { position: fixed; top: 12px; left: 12px; background: #1f232acc; padding: 10px 12px; border-radius: 8px; min-width: 250px; }
    #hud h1 { font-size: 14px; margin: 0 0 6px; }
    #hud label { display: block; margin: 4px 0; }
    #hud button { margin-top: 6px; }
    #stats { margin-top: 8px; font-family: ui-monospace, monospace; white-space: pre; }
  </style>
</head>
<body>
  <div id="hud">
    <h1>MuJoCo cloth: sew + drape</h1>
    <label>Garment
      <select id="garment">
        <option value="tshirt" selected>T-shirt</option>
        <option value="panels">Two panels</option>
      </select>
    </label>
    <label>Resolution
      <select id="spacing">
        <option value="0.03" selected>3 cm</option>
        <option value="0.02">2 cm</option>
        <option value="0.015">1.5 cm</option>
        <option value="0.01">1 cm</option>
      </select>
    </label>
    <label><input type="checkbox" id="self" /> Cloth self-collision</label>
    <button id="restart">Restart</button>
    <div id="stats">loading MuJoCo…</div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
